name: Android build

# Release APK of the Flutter app (arm64 + armv7), signed with the release key from the
# repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD. A version tag (v1.0.0, ...) publishes it as a GitHub release; a manual
# run only keeps it as a workflow artifact. Built without a Firebase configuration: push
# notifications are off, the app notifies while it runs (mobile/README.md).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.94.1 --profile minimal \
            --target aarch64-linux-android,armv7-linux-androideabi
          rustup default 1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      # libsignal generates code from .proto files.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Release signing key
        working-directory: mobile/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties
      - name: Build
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm,android-arm64
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/Dialog-android.apk
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" mobile/android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: Dialog-android
          path: dist/Dialog-android.apk
          if-no-files-found: error
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" -R ${{ github.repository }} >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" -R ${{ github.repository }} --clobber dist/Dialog-android.apk
          else
            gh release create "${{ github.ref_name }}" -R ${{ github.repository }} --title "Dialog ${{ github.ref_name }}" --generate-notes dist/Dialog-android.apk
          fi
