[package]
name = "chat-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Dialog client core: Signal protocol, local storage, networking and sync"

[dependencies]
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.103.1" }
libsignal-core = { git = "https://github.com/signalapp/libsignal", tag = "v0.103.1" }
zkgroup = { git = "https://github.com/signalapp/libsignal", tag = "v0.103.1" }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "fs"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
async-trait = "0.1"
thiserror = "2"
log = "0.4"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
bip39 = "2"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
argon2 = "0.5"
aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
ed25519-dalek = "2"
zeroize = "1"
subtle = "2"
hex = "0.4"
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
mime_guess = "2"

[features]
# Only for the e2e attack tests: lets a test client behave like a modified (malicious) client.
insecure-test-hooks = []

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
env_logger = "0.11"
tempfile = "3"
sha1 = "0.10"

# Shortens the media retention limit for the whole process (engine/retention.rs).
[[test]]
name = "e2e_media_retention"
required-features = ["insecure-test-hooks"]
