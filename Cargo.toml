[workspace]
resolver = "2"
members = ["crates/chat-core", "crates/voice-fx", "mobile/rust"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Dialog contributors"]

[profile.dev]
# Debug info makes the build directory huge (libsignal, SQLCipher); keep line tables only.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
# Crypto (argon2, kyber) is painfully slow unoptimized; optimize dependencies in dev builds.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
